    tab_friends:'👥 友達',tab_tasks:'📋 タスク',tab_ach:'🏅 実績',tab_profile:'👤 プロフ',no_friends:'友達なし',add_friend:'➕ 追加',confirm:'✅ 確認',cancel:'キャンセル',
    tasks_title:'📋 タスク',quarrel:'💢 喧嘩 -18',edit:'✏️ 編集',logout:'🚪 ログアウト',save:'💾 保存',
    not_found:'❌ 見つかりません',self_add:'❌ 自分は追加不可',already:'❌ 既に友達',
    email_err:'メール入力',code_err:'8文字',nick_err:'ニック入力',bad_nick:'禁止',email_used:'メール使用済',email_not_found:'見つかりません',wrong_code:'間違ったコード',
    claimed:'✅ 取得済',get:'🎁 取得',locked:'🔒 ロック',card_label:'🃏 カード:',avatar_label:'🖼️ アバター:',your_code:'友達コード:',copy:'📋 コピー',copied:'✅ コピー!',add_by_code:'友達コード入力',found_friend:'これがあなたの友達です！',
    years:'歳'
  },
  ko:{
    welcome:'🌟 환영합니다',email_ph:'이메일',code_ph:'코드(8자)',nick_ph:'닉네임',date_label:'📅 생일:',login_btn:'로그인',register_btn:'회원가입',no_acc:'계정 없음?',has_acc:'계정 있음?',
    tab_friends:'👥 친구',tab_tasks:'📋 과제',tab_ach:'🏅 성과',tab_profile:'👤 프로필',no_friends:'친구 없음',add_friend:'➕ 추가',confirm:'✅ 확인',cancel:'취소',
    tasks_title:'📋 과제',quarrel:'💢 다툼 -18',edit:'✏️ 편집',logout:'🚪 로그아웃',save:'💾 저장',
    not_found:'❌ 찾을 수 없음',self_add:'❌ 자신 추가 불가',already:'❌ 이미 친구',
    email_err:'이메일 입력',code_err:'8자',nick_err:'닉네임 입력',bad_nick:'금지',email_used:'이메일 사용 중',email_not_found:'찾을 수 없음',wrong_code:'잘못된 코드',
    claimed:'✅ 획득',get:'🎁 획득',locked:'🔒 잠김',card_label:'🃏 카드:',avatar_label:'🖼️ 아바타:',your_code:'친구 코드:',copy:'📋 복사',copied:'✅ 복사됨!',add_by_code:'친구 코드 입력',found_friend:'이것은 당신의 친구입니다!',
    years:'세'
  }
  };
  let lang='ru';function t(k){return LANGS[lang]?.[k]||LANGS['ru'][k]||k}
  function getMonths(){return LANGS[lang]?.months||MONTHS_RU}
  let users={},cur=null;
  function load(){try{users=JSON.parse(localStorage.getItem(STORAGE))||{}}catch(e){users={}}}
  function save(){localStorage.setItem(STORAGE,JSON.stringify(users))}
  function refresh(){load()}
  function sess(e){localStorage.setItem(SESSION,e)}
  function getSess(){return localStorage.getItem(SESSION)}
  function clearSess(){localStorage.removeItem(SESSION)}
  function bad(txt){return BAD.some(w=>txt.toLowerCase().replace(/[^а-яёa-z]/g,'').includes(w))}
  function genCode(){let c;do{c=Math.random().toString(36).substring(2,10).toUpperCase()}while(Object.values(users).some(u=>u.friendCode===c));return c}
  function byEmail(e){refresh();return users[e.trim().toLowerCase()]}
  function byCode(code){refresh();return Object.values(users).find(u=>u.friendCode===code.toUpperCase())}
  function title(c){return TITLES.reduce((a,b)=>c>=b.min?b:a)}
  function cardCls(c,card){if(card==='rainbow')return'border-purple';if(['dragon','royal','nebula'].includes(card))return'border-purple';if(['sheriff','golden','phoenix','unicorn'].includes(card))return'border-gold';if(['ocean','diamond'].includes(card))return'border-blue';if(['master','forest'].includes(card))return'border-green';if(c>=3500)return'border-purple';if(c>=2000)return'border-purple';if(c>=1000)return'border-blue';if(c>=500)return'border-green';if(c>=200)return'border-gold';return''}
  function applyLang(){
    document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;if(t(k))el.textContent=t(k)});
    document.querySelectorAll('[data-placeholder]').forEach(el=>{const k=el.dataset.placeholder;if(t(k))el.placeholder=t(k)});
  }
  function buildLangDropdown(){
    const dd=document.getElementById('langDropdown');
    const names={ru:'🇷🇺 Русский',en:'🇬🇧 English',es:'🇪🇸 Español',fr:'🇫🇷 Français',de:'🇩🇪 Deutsch',pt:'🇵🇹 Português',it:'🇮🇹 Italiano',zh:'🇨🇳 中文',ja:'🇯🇵 日本語',ko:'🇰🇷 한국어'};
    dd.innerHTML=Object.entries(names).map(([c,n])=>`<button class="lang-option" data-lang="${c}">${n}</button>`).join('');
    dd.querySelectorAll('.lang-option').forEach(o=>o.onclick=function(e){e.stopPropagation();lang=this.dataset.lang;dd.classList.remove('show');applyLang();if(cur&&users[cur]){renderFriends();renderTasks();renderAchievements();renderProfile()}else renderAuth()});
  }
  document.getElementById('langToggle').onclick=(e)=>{e.stopPropagation();document.getElementById('langDropdown').classList.toggle('show')};
  document.addEventListener('click',(e)=>{const dd=document.getElementById('langDropdown');const btn=document.getElementById('langToggle');if(!btn.contains(e.target)&&!dd.contains(e.target))dd.classList.remove('show')});

  function logout(){cur=null;clearSess();document.getElementById('mainTabs').style.display='none';['friendsScreen','tasksScreen','achievementsScreen','profileScreen'].forEach(id=>{const s=document.getElementById(id);s.innerHTML='';s.classList.remove('active')});renderAuth()}

  function renderAuth(){
    const a=document.getElementById('authScreen');a.innerHTML='';a.classList.add('active');
    const c=document.createElement('div');c.className='card';c.style.marginTop='30px';
    c.innerHTML=`<h2 style="color:#ffd966;text-align:center">${t('welcome')}</h2>
    <input id="authEmail" class="input-field" data-placeholder="email_ph"><span class="error-text" id="emailErr"></span>
    <input id="authCode" class="input-field" data-placeholder="code_ph" maxlength="8"><span class="error-text" id="codeErr"></span>
    <div id="regExtra" style="display:none"><input id="authNick" class="input-field" data-placeholder="nick_ph"><span class="error-text" id="nickErr"></span>
    <label>${t('date_label')}</label><div class="wheel-container"><div class="wheel-col"><button class="wheel-btn" id="rDu">▲</button><span class="wheel-value" id="rDv">15</span><button class="wheel-btn" id="rDd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="rMu">▲</button><span class="wheel-value" id="rMv">${getMonths()[5]}</span><button class="wheel-btn" id="rMd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="rYu">▲</button><span class="wheel-value" id="rYv">2005</span><button class="wheel-btn" id="rYd">▼</button></div></div></div>
    <button class="btn" id="authBtn">${t('login_btn')}</button>
    <p style="text-align:center;margin-top:10px"><a id="toggleMode" style="color:#ffd966;cursor:pointer">${t('no_acc')}</a></p>`;
    a.appendChild(c);applyLang();
    let mode='login',rD=15,rM=6,rY=2005;
    function updMonths(){document.getElementById('rMv').textContent=getMonths()[rM-1]}
    function upd(){document.getElementById('rDv').textContent=rD;updMonths();document.getElementById('rYv').textContent=rY}
    document.getElementById('toggleMode').onclick=()=>{mode=mode==='login'?'register':'login';document.getElementById('regExtra').style.display=mode==='register'?'block':'none';document.getElementById('authBtn').textContent=mode==='login'?t('login_btn'):t('register_btn');document.getElementById('toggleMode').textContent=mode==='login'?t('no_acc'):t('has_acc')};
    document.getElementById('rDu').onclick=()=>{rD=rD%31+1;upd()};document.getElementById('rDd').onclick=()=>{rD=rD-1||31;upd()};
    document.getElementById('rMu').onclick=()=>{rM=rM%12+1;upd()};document.getElementById('rMd').onclick=()=>{rM=rM-1||12;upd()};
    document.getElementById('rYu').onclick=()=>{if(rY<2026)rY++;upd()};document.getElementById('rYd').onclick=()=>{if(rY>1920)rY--;upd()};
    document.getElementById('authBtn').onclick=()=>{
      refresh();const email=document.getElementById('authEmail').value.trim().toLowerCase();
      const code=document.getElementById('authCode').value.trim();
      const emailErr=document.getElementById('emailErr'),codeErr=document.getElementById('codeErr'),nickErr=document.getElementById('nickErr');
      emailErr.style.display='none';codeErr.style.display='none';if(nickErr)nickErr.style.display='none';
      if(!email.includes('@')){emailErr.textContent=t('email_err');emailErr.style.display='block';return}
      if(code.length!==8){codeErr.textContent=t('code_err');codeErr.style.display='block';return}
      if(mode==='register'){
        const nick=document.getElementById('authNick').value.trim();
        if(!nick){nickErr.textContent=t('nick_err');nickErr.style.display='block';return}
        if(bad(nick)){nickErr.textContent=t('bad_nick');nickErr.style.display='block';return}
        if(users[email]){emailErr.textContent=t('email_used');emailErr.style.display='block';return}
        const fc=genCode();
        users[email]={email,nick,code,friendCode:fc,profile:{avatar:'🙂',day:rD,month:rM,year:rY},friends:[],unlockedAvatars:['🙂'],unlockedCards:['default'],selectedCard:'default',claimed:[],totalTasks:0,quarrelCount:0};
        save();cur=email;sess(email);enterApp();
      }else{
        const u=users[email];
        if(!u){emailErr.textContent=t('email_not_found');emailErr.style.display='block';return}
        if(u.code!==code){codeErr.textContent=t('wrong_code');codeErr.style.display='block';return}
        if(!u.friendCode){u.friendCode=genCode();save()}
        cur=email;sess(email);enterApp();
      }
    };
  }

  function enterApp(){document.getElementById('authScreen').classList.remove('active');document.getElementById('mainTabs').style.display='flex';switchTab('friends')}
  const tabs=document.querySelectorAll('#mainTabs .tab');
  const sc={friends:document.getElementById('friendsScreen'),tasks:document.getElementById('tasksScreen'),achievements:document.getElementById('achievementsScreen'),profile:document.getElementById('profileScreen')};
  function switchTab(tn){tabs.forEach(b=>b.classList.remove('active'));document.querySelector(`#mainTabs .tab[data-tab="${tn}"]`).classList.add('active');Object.values(sc).forEach(s=>s.classList.remove('active'));sc[tn].classList.add('active');if(tn==='friends')renderFriends();if(tn==='tasks')renderTasks();if(tn==='achievements')renderAchievements();if(tn==='profile')renderProfile()}
  tabs.forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

  function renderFriends(){
    refresh();const c=sc.friends;c.innerHTML='';const u=users[cur];if(!u)return;
    if(!u.friends.length)c.innerHTML=`<p style="text-align:center;color:#aaa;margin-top:40px">${t('no_friends')}</p>`;
    else u.friends.forEach(f=>{
      const fu=Object.values(users).find(x=>x.friendCode===f.code);
      const ti=title(f.cups);const cls=cardCls(f.cups,fu?.selectedCard);
      const d=document.createElement('div');d.className=`card ${cls}`;
      d.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span class="friend-avatar">${fu?.profile?.avatar||'🙂'}</span><div style="flex:1"><strong>${fu?.nick||f.code}</strong><br><span style="color:#f9c74f">${ti.n}</span></div><div style="text-align:right">🏆${f.cups} <span class="streak-badge">🔥${f.streak||0}д</span></div></div>`;
      c.appendChild(d);
    });
    const add=document.createElement('button');add.className='btn';add.textContent=t('add_friend');add.onclick=()=>showAddFriend();c.appendChild(add);
  }

  function showAddFriend(){
    refresh();const m=document.createElement('div');m.className='modal active';
    m.innerHTML=`<div class="modal-content"><h3 style="color:#ffd966">${t('add_friend')}</h3><p style="color:#aaa;font-size:0.8rem">${t('add_by_code')}</p><input id="addCode" class="input-field" placeholder="ABC12345"><span class="error-text" id="addErr"></span><div id="addP" style="margin:10px 0;min-height:50px"></div><button class="btn" id="confB" disabled>${t('confirm')}</button><button class="btn" id="cancB" style="background:#555">${t('cancel')}</button></div>`;
    document.body.appendChild(m);
    const inp=m.querySelector('#addCode'),err=m.querySelector('#addErr'),prev=m.querySelector('#addP'),conf=m.querySelector('#confB');let found=null;
    function update(){
      refresh();const code=inp.value.trim();err.style.display='none';prev.innerHTML='';conf.disabled=true;found=null;
      if(!code)return;
      found=byCode(code);const u=users[cur];
      if(!found)err.textContent=t('not_found');
      else if(found.email===cur)err.textContent=t('self_add');
      else if(u.friends.some(f=>f.code===found.friendCode))err.textContent=t('already');
      else{prev.innerHTML=`<div class="card"><span style="font-size:2rem">${found.profile.avatar}</span> <strong>${found.nick}</strong><br><small>${found.friendCode}</small><br><span style="color:#6fcf97">${t('found_friend')}</span></div>`;conf.disabled=false;return}
      err.style.display='block';
    }
    inp.oninput=update;
    conf.onclick=()=>{if(!found)return;const u=users[cur];u.friends.push({code:found.friendCode,cups:0,streak:0});if(!found.friends.some(f=>f.code===u.friendCode))found.friends.push({code:u.friendCode,cups:0,streak:0});save();renderFriends();m.remove()};
    m.querySelector('#cancB').onclick=()=>m.remove();
  }

  function renderTasks(){
    refresh();const c=sc.tasks;c.innerHTML=`<h3 style="color:#ffd966">${t('tasks_title')}</h3>`;const u=users[cur];
    u.friends.forEach(f=>{
      const fu=Object.values(users).find(x=>x.friendCode===f.code);
      const d=document.createElement('div');d.className='card';d.innerHTML=`<strong>${fu?.nick||f.code}</strong>`;
      [{l:'🚶 +20',v:20},{l:'🏠 +25',v:25},{l:'🎮 +22',v:22},{l:'🆘 +15',v:15},{l:'🎁 +30',v:30}].forEach(tk=>{
        const b=document.createElement('button');b.className='btn';b.textContent=tk.l;
        b.onclick=()=>{f.cups+=tk.v;f.streak=(f.streak||0)+1;u.totalTasks=(u.totalTasks||0)+1;if(fu){const rf=fu.friends.find(x=>x.code===u.friendCode);if(rf)rf.cups+=tk.v}save();renderTasks();renderFriends()};
        d.appendChild(b);
      });
      const q=document.createElement('button');q.className='btn danger';q.textContent=t('quarrel');
      q.onclick=()=>{f.cups=Math.max(0,f.cups-18);f.streak=0;u.quarrelCount=(u.quarrelCount||0)+1;save();renderTasks()};
      d.appendChild(q);c.appendChild(d);
    });
  }

  function renderAchievements(){
    const c=sc.achievements;c.innerHTML=`<h3 style="color:#ffd966">${t('tab_ach')}</h3>`;const u=users[cur];
    ACH.forEach(a=>{
      const done=u.claimed?.includes(a.id);
      const check=()=>{const f=u.friends;switch(a.id){case'f1':return f.length>=1;case'f3':return f.length>=3;case'f5':return f.length>=5;case'c100':return f.some(x=>x.cups>=100);case'c500':return f.some(x=>x.cups>=500);case'c1000':return f.some(x=>x.cups>=1000);case'c2000':return f.some(x=>x.cups>=2000);case'c3500':return f.some(x=>x.cups>=3500);case'q1':return(u.quarrelCount||0)>=1;case's7':return f.some(x=>(x.streak||0)>=7);case's30':return f.some(x=>(x.streak||0)>=30);case't10':return(u.totalTasks||0)>=10;case't50':return(u.totalTasks||0)>=50;case'col5':return(u.unlockedCards||[]).length>=5;case'all100':return f.length>0&&f.every(x=>x.cups>=100);default:return false}};
      const can=check()&&!done;const d=document.createElement('div');d.className='achievement-card';if(can)d.classList.add('glow-ach');
      d.innerHTML=`<strong>${a.name}</strong><br><small>${a.desc}</small><br><small style="color:#f9c74f">${a.reward}</small>`;
      if(done)d.innerHTML+=`<p style="color:#6fcf97">${t('claimed')}</p>`;
      else if(can){const b=document.createElement('button');b.className='btn';b.textContent=t('get');b.onclick=()=>{if(!u.claimed)u.claimed=[];u.claimed.push(a.id);const[tp,v]=a.reward.split(':');if(tp==='avatar'&&!u.unlockedAvatars.includes(v))u.unlockedAvatars.push(v);if(tp==='card'&&!u.unlockedCards.includes(v))u.unlockedCards.push(v);save();renderAchievements();renderProfile()};d.appendChild(b)}
      else d.innerHTML+=`<p style="color:#ff6b6b">${t('locked')}</p>`;
      c.appendChild(d);
    });
  }

  function renderProfile(){
    const c=sc.profile;c.innerHTML='';const u=users[cur];if(!u)return;
    const age=new Date().getFullYear()-u.profile.year;const cls=cardCls(0,u.selectedCard);
    c.innerHTML=`<div class="card ${cls}"><div style="text-align:center"><span style="font-size:3.5rem">${u.profile.avatar}</span><h2>${u.nick}</h2><p>📧 ${u.email}</p><p>${age} ${t('years')} · ${u.profile.day} ${getMonths()[u.profile.month-1]} ${u.profile.year}</p><p>${t('card_label')} ${u.selectedCard}</p><div class="code-display"><span>${t('your_code')} <strong>${u.friendCode}</strong></span><button class="btn copy" id="copyCode">${t('copy')}</button></div></div><button class="btn" id="editB">${t('edit')}</button><button class="btn logout" id="logoutB">${t('logout')}</button></div>`;
    document.getElementById('copyCode').onclick=()=>{navigator.clipboard.writeText(u.friendCode).then(()=>{const b=document.getElementById('copyCode');b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),2000)})};
    document.getElementById('editB').onclick=()=>{
      const m=document.createElement('div');m.className='modal active';let eD=u.profile.day,eM=u.profile.month,eY=u.profile.year;
      m.innerHTML=`<div class="modal-content"><h3 style="color:#ffd966">${t('edit')}</h3><div class="wheel-container"><div class="wheel-col"><button class="wheel-btn" id="eDu">▲</button><span class="wheel-value" id="eDv">${eD}</span><button class="wheel-btn" id="eDd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="eMu">▲</button><span class="wheel-value" id="eMv">${getMonths()[eM-1]}</span><button class="wheel-btn" id="eMd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="eYu">▲</button><span class="wheel-value" id="eYv">${eY}</span><button class="wheel-btn" id="eYd">▼</button></div></div><label>${t('avatar_label')}</label><div id="avG" style="display:flex;flex-wrap:wrap;gap:5px">${u.unlockedAvatars.map(a=>`<span style="font-size:1.8rem;cursor:pointer" data-a="${a}">${a}</span>`).join('')}</div><label>${t('card_label')}</label><select id="cardS" style="width:100%;padding:10px;border-radius:18px;background:#2a2340;color:white">${u.unlockedCards.map(c=>`<option ${u.selectedCard===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn" id="saveE">${t('save')}</button></div>`;
      document.body.appendChild(m);
      function upd(){m.querySelector('#eDv').textContent=eD;m.querySelector('#eMv').textContent=getMonths()[eM-1];m.querySelector('#eYv').textContent=eY}
      m.querySelector('#eDu').onclick=()=>{eD=eD%31+1;upd()};m.querySelector('#eDd').onclick=()=>{eD=eD-1||31;upd()};
      m.querySelector('#eMu').onclick=()=>{eM=eM%12+1;upd()};m.querySelector('#eMd').onclick=()=>{eM=eM-1||12;upd()};
      m.querySelector('#eYu').onclick=()=>{if(eY<2026)eY++;upd()};m.querySelector('#eYd').onclick=()=>{if(eY>1920)eY--;upd()};
      m.querySelectorAll('#avG span').forEach(s=>s.onclick=function(){u.profile.avatar=this.dataset.a;save();renderProfile();m.remove()});
      m.querySelector('#saveE').onclick=()=>{u.profile.day=eD;u.profile.month=eM;u.profile.year=eY;u.selectedCard=m.querySelector('#cardS').value;save();renderProfile();m.remove()};
    };
    document.getElementById('logoutB').onclick=()=>logout();
  }

  buildLangDropdown();
  load();
  const s=getSess();
  if(s&&users[s]){cur=s;enterApp()}
  else{cur=null;clearSess();renderAuth()}
})();
</script>
</body>
</html>
