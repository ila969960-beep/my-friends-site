  function applyLang() {

  let currentUserEmail = null;
  let allUsersCache = {};

  async function loadAllUsers() { const snapshot = await db.ref('users').once('value'); allUsersCache = snapshot.val() || {}; }
  async function saveUser(email, userData) { await db.ref('users/' + email.replace('.', '_')).set(userData); }
  async function getUser(email) { await loadAllUsers(); return allUsersCache[email] || null; }
  async function updateUser(email, updates) { await db.ref('users/' + email.replace('.', '_')).update(updates); }
  async function generateFriendCode() { await loadAllUsers(); let code; do { code = Math.random().toString(36).substring(2, 10).toUpperCase(); } while (Object.values(allUsersCache).some(u => u.friendCode === code)); return code; }
  async function findUserByCode(code) { await loadAllUsers(); return Object.values(allUsersCache).find(u => u.friendCode === code.toUpperCase()); }
  function bad(txt) { return BAD.some(w => txt.toLowerCase().replace(/[^а-яёa-z]/g,'').includes(w)); }
  function title(cups) { return TITLES.reduce((a,b) => cups >= b.min ? b : a); }
  function cardCls(cups, card) {
    if (card === 'rainbow') return 'border-purple';
    if (['dragon','royal','nebula'].includes(card)) return 'border-purple';
    if (['sheriff','golden','phoenix','unicorn'].includes(card)) return 'border-gold';
    if (['ocean','diamond'].includes(card)) return 'border-blue';
    if (['master','forest'].includes(card)) return 'border-green';
    if (cups >= 3500) return 'border-purple';
    if (cups >= 2000) return 'border-purple';
    if (cups >= 1000) return 'border-blue';
    if (cups >= 500) return 'border-green';
    if (cups >= 200) return 'border-gold';
    return '';
  }

  function checkAchievement(user, achId) {
    const f = user.friends || [];
    switch(achId) {
      case 'f1': return f.length >= 1;
      case 'f3': return f.length >= 3;
      case 'f5': return f.length >= 5;
      case 'c50': return f.some(x => x.cups >= 50);
      case 'c100': return f.some(x => x.cups >= 100);
      case 'c500': return f.some(x => x.cups >= 500);
      case 'c1000': return f.some(x => x.cups >= 1000);
      case 'c2000': return f.some(x => x.cups >= 2000);
      case 'c3500': return f.some(x => x.cups >= 3500);
      case 'q1': return (user.quarrelCount || 0) >= 1;
      case 'q5': return (user.quarrelCount || 0) >= 5;
      case 's3': return f.some(x => (x.streak || 0) >= 3);
      case 's7': return f.some(x => (x.streak || 0) >= 7);
      case 's14': return f.some(x => (x.streak || 0) >= 14);
      case 's30': return f.some(x => (x.streak || 0) >= 30);
      case 's60': return f.some(x => (x.streak || 0) >= 60);
      case 't5': return (user.totalTasks || 0) >= 5;
      case 't20': return (user.totalTasks || 0) >= 20;
      case 't50': return (user.totalTasks || 0) >= 50;
      case 'all100': return f.length > 0 && f.every(x => x.cups >= 100);
      default: return false;
    }
  }

    const card = document.createElement('div'); card.className = 'card'; card.style.marginTop = '30px';
    card.innerHTML = `<h2 style="color:#ffd966;text-align:center">${t('welcome')}</h2><input id="authEmail" class="input-field" data-placeholder="email_ph" type="email"><span class="error-text" id="emailErr"></span><input id="authCode" class="input-field" data-placeholder="code_ph" maxlength="8"><span class="error-text" id="codeErr"></span><div id="regExtra" style="display:none"><input id="authNick" class="input-field" data-placeholder="nick_ph"><span class="error-text" id="nickErr"></span><label>${t('date_label')}</label><div class="wheel-container"><div class="wheel-col"><button class="wheel-btn" id="rDu">▲</button><span class="wheel-value" id="rDv">15</span><button class="wheel-btn" id="rDd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="rMu">▲</button><span class="wheel-value" id="rMv">${getMonths()[5]}</span><button class="wheel-btn" id="rMd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="rYu">▲</button><span class="wheel-value" id="rYv">2005</span><button class="wheel-btn" id="rYd">▼</button></div></div></div><button class="btn" id="authBtn">${t('login_btn')}</button><p style="text-align:center;margin-top:10px"><a id="toggleMode" style="color:#ffd966;cursor:pointer">${t('no_acc')}</a></p>`;
    auth.appendChild(card); applyLang();
    let mode = 'login', rD = 15, rM = 6, rY = 2005;
    function updMonths() { document.getElementById('rMv').textContent = getMonths()[rM-1]; }
    function upd() { document.getElementById('rDv').textContent = rD; updMonths(); document.getElementById('rYv').textContent = rY; }
    document.getElementById('toggleMode').onclick = () => { mode = mode === 'login' ? 'register' : 'login'; document.getElementById('regExtra').style.display = mode === 'register' ? 'block' : 'none'; document.getElementById('authBtn').textContent = mode === 'login' ? t('login_btn') : t('register_btn'); document.getElementById('toggleMode').textContent = mode === 'login' ? t('no_acc') : t('has_acc'); };
    document.getElementById('rDu').onclick = () => { rD = rD % 31 + 1; upd(); }; document.getElementById('rDd').onclick = () => { rD = rD - 1 || 31; upd(); };
    document.getElementById('rMu').onclick = () => { rM = rM % 12 + 1; upd(); }; document.getElementById('rMd').onclick = () => { rM = rM - 1 || 12; upd(); };
    document.getElementById('rYu').onclick = () => { if (rY < 2026) rY++; upd(); }; document.getElementById('rYd').onclick = () => { if (rY > 1920) rY--; upd(); };
    document.getElementById('authBtn').onclick = async () => {
      const email = document.getElementById('authEmail').value.trim().toLowerCase();
      const code = document.getElementById('authCode').value.trim();
      const emailErr = document.getElementById('emailErr'), codeErr = document.getElementById('codeErr'), nickErr = document.getElementById('nickErr');
      emailErr.style.display = 'none'; codeErr.style.display = 'none'; if (nickErr) nickErr.style.display = 'none';
      if (!email.includes('@')) { emailErr.textContent = t('email_err'); emailErr.style.display = 'block'; return; }
      if (code.length !== 8) { codeErr.textContent = t('code_err'); codeErr.style.display = 'block'; return; }
      const btn = document.getElementById('authBtn'); btn.disabled = true; btn.textContent = '...';
      try {
        if (mode === 'register') {
          const nick = document.getElementById('authNick').value.trim();
          if (!nick) { nickErr.textContent = t('nick_err'); nickErr.style.display = 'block'; btn.disabled = false; btn.textContent = t('register_btn'); return; }
          if (bad(nick)) { nickErr.textContent = t('bad_nick'); nickErr.style.display = 'block'; btn.disabled = false; btn.textContent = t('register_btn'); return; }
          const all = await loadAllUsers();
          if (all[email]) { emailErr.textContent = t('email_used'); emailErr.style.display = 'block'; btn.disabled = false; btn.textContent = t('register_btn'); return; }
          const friendCode = await generateFriendCode();
          const userData = { email, nick, code, friendCode, profile: { avatar: '🙂', day: rD, month: rM, year: rY }, friends: [], unlockedAvatars: ['🙂'], unlockedCards: ['default'], selectedCard: 'default', claimedAchievements: [], totalTasks: 0, quarrelCount: 0 };
          await saveUser(email, userData);
          currentUserEmail = email; localStorage.setItem('uzi_session', email);
          enterApp();
        } else {
          const user = await getUser(email);
          if (!user) { emailErr.textContent = t('email_not_found'); emailErr.style.display = 'block'; btn.disabled = false; btn.textContent = t('login_btn'); return; }
          if (user.code !== code) { codeErr.textContent = t('wrong_code'); codeErr.style.display = 'block'; btn.disabled = false; btn.textContent = t('login_btn'); return; }
          currentUserEmail = email; localStorage.setItem('uzi_session', email);
          enterApp();
        }
      } catch(e) { alert('Ошибка соединения'); btn.disabled = false; btn.textContent = mode === 'login' ? t('login_btn') : t('register_btn'); }
    };
  }

    document.body.appendChild(modal);
    const inp = modal.querySelector('#addCode'), err = modal.querySelector('#addErr'), prev = modal.querySelector('#addPreview'), conf = modal.querySelector('#confBtn');
    let found = null;
    async function update() {
      const code = inp.value.trim(); err.style.display = 'none'; prev.innerHTML = ''; conf.disabled = true; found = null;
      if (!code) return;

      const can = checkAchievement(user, ach.id) && !done;
      const card = document.createElement('div'); card.className = 'achievement-card' + (can ? ' glow-ach' : '');
      const name = ach[currentLang] || ach.ru;
      const desc = ach['desc_'+currentLang] || ach.desc_ru;
      card.innerHTML = `<strong>${name}</strong><br><small>${desc}</small><br><small style="color:#f9c74f">${ach.reward}</small>`;
      if (done) card.innerHTML += `<p style="color:#6fcf97">${t('claimed')}</p>`;
      else if (can) {
        const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = t('get');
        btn.onclick = async () => {
          user.claimedAchievements = user.claimedAchievements || []; user.claimedAchievements.push(ach.id);
          const [tp, val] = ach.reward.split(':');
          if (tp === 'avatar' && !user.unlockedAvatars.includes(val)) user.unlockedAvatars.push(val);
          if (tp === 'card' && !user.unlockedCards.includes(val)) user.unlockedCards.push(val);
          await updateUser(currentUserEmail, { claimedAchievements: user.claimedAchievements, unlockedAvatars: user.unlockedAvatars, unlockedCards: user.unlockedCards });
          renderAchievements(); renderProfile();
        };
        card.appendChild(btn);
      } else card.innerHTML += `<p style="color:#ff6b6b">${t('locked')}</p>`;
      container.appendChild(card);
    });
  }

  async function renderProfile() {
    const container = screens.profile; container.innerHTML = '<p class="loading-text">Загрузка...</p>';
    const user = await getUser(currentUserEmail); if (!user) return;
    const age = new Date().getFullYear() - user.profile.year; const cls = cardCls(0, user.selectedCard);
    container.innerHTML = `<div class="card ${cls}"><div style="text-align:center"><span style="font-size:3.5rem">${user.profile.avatar}</span><h2>${user.nick}</h2><p>📧 ${user.email}</p><p>${age} ${t('years')} · ${user.profile.day} ${getMonths()[user.profile.month-1]} ${user.profile.year}</p><p>${t('card_label')} ${user.selectedCard}</p><div class="code-display"><span>${t('your_code')} <strong>${user.friendCode}</strong></span><button class="btn copy" id="copyCode">${t('copy')}</button></div></div><button class="btn" id="editBtn">${t('edit')}</button><button class="btn logout" id="logoutBtn">${t('logout')}</button></div>`;
    document.getElementById('copyCode').onclick = () => { navigator.clipboard.writeText(user.friendCode).then(() => { const b = document.getElementById('copyCode'); b.textContent = t('copied'); setTimeout(() => b.textContent = t('copy'), 2000); }); };
    document.getElementById('editBtn').onclick = () => showEditProfile(user);
    document.getElementById('logoutBtn').onclick = () => logout();
  }

  function showEditProfile(user) {
    const modal = document.createElement('div'); modal.className = 'modal active';
    let eD = user.profile.day, eM = user.profile.month, eY = user.profile.year;
    modal.innerHTML = `<div class="modal-content"><h3 style="color:#ffd966">${t('edit')}</h3><div class="wheel-container"><div class="wheel-col"><button class="wheel-btn" id="eDu">▲</button><span class="wheel-value" id="eDv">${eD}</span><button class="wheel-btn" id="eDd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="eMu">▲</button><span class="wheel-value" id="eMv">${getMonths()[eM-1]}</span><button class="wheel-btn" id="eMd">▼</button></div><div class="wheel-col"><button class="wheel-btn" id="eYu">▲</button><span class="wheel-value" id="eYv">${eY}</span><button class="wheel-btn" id="eYd">▼</button></div></div><label>${t('avatar_label')}</label><div id="avGrid" style="display:flex;flex-wrap:wrap;gap:5px">${user.unlockedAvatars.map(a => `<span style="font-size:1.8rem;cursor:pointer" data-a="${a}">${a}</span>`).join('')}</div><label>${t('card_label')}</label><select id="cardSel" style="width:100%;padding:10px;border-radius:18px;background:#2a2340;color:white">${user.unlockedCards.map(c => `<option ${user.selectedCard===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn" id="saveEdit">${t('save')}</button></div>`;
    document.body.appendChild(modal);
    function upd() { modal.querySelector('#eDv').textContent = eD; modal.querySelector('#eMv').textContent = getMonths()[eM-1]; modal.querySelector('#eYv').textContent = eY; }
    modal.querySelector('#eDu').onclick = () => { eD = eD % 31 + 1; upd(); }; modal.querySelector('#eDd').onclick = () => { eD = eD - 1 || 31; upd(); };
    modal.querySelector('#eMu').onclick = () => { eM = eM % 12 + 1; upd(); }; modal.querySelector('#eMd').onclick = () => { eM = eM - 1 || 12; upd(); };
    modal.querySelector('#eYu').onclick = () => { if (eY < 2026) eY++; upd(); }; modal.querySelector('#eYd').onclick = () => { if (eY > 1920) eY--; upd(); };
    modal.querySelectorAll('#avGrid span').forEach(s => s.onclick = async function() { user.profile.avatar = this.dataset.a; await updateUser(currentUserEmail, { profile: user.profile }); modal.remove(); renderProfile(); });
    modal.querySelector('#saveEdit').onclick = async () => { user.profile.day = eD; user.profile.month = eM; user.profile.year = eY; user.selectedCard = modal.querySelector('#cardSel').value; await updateUser(currentUserEmail, { profile: user.profile, selectedCard: user.selectedCard }); modal.remove(); renderProfile(); };
  }

  // ==================== СТАРТ ====================
  async function init() {
    buildLangDropdown();
    const saved = localStorage.getItem('uzi_session');
    if (saved) {
      try {
        const user = await getUser(saved);
        if (user) { currentUserEmail = saved; enterApp(); return; }
      } catch(e) {}
    }
    showScreen('authScreen');
    renderAuth();
  }
  init();
</script>
</body>
</html>
