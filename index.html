  let currentLang = 'ru';
  let users = {};
  let currentUser = null;

  function t(key) {
    return (LANGUAGES[currentLang] && LANGUAGES[currentLang][key]) || LANGUAGES['ru'][key] || key;
  }

  function applyLanguage() {
    document.querySelectorAll('[data-key]').forEach(el => {
      const key = el.dataset.key;
      if (t(key)) el.textContent = t(key);
    });
    document.querySelectorAll('[data-placeholder]').forEach(el => {
      const key = el.dataset.placeholder;
      if (t(key)) el.placeholder = t(key);
    });
  }

  function buildLangDropdown() {
    const dd = document.getElementById('langDropdown');
    const names = {
      ru: '🇷🇺 Русский', en: '🇬🇧 English', es: '🇪🇸 Español', fr: '🇫🇷 Français',
      de: '🇩🇪 Deutsch', pt: '🇵🇹 Português', it: '🇮🇹 Italiano',
      zh: '🇨🇳 中文', ja: '🇯🇵 日本語', ko: '🇰🇷 한국어'
    };
    dd.innerHTML = Object.entries(names).map(([code, name]) =>
      `<button class="lang-option" data-lang="${code}">${name}</button>`
    ).join('');
    dd.querySelectorAll('.lang-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        currentLang = opt.dataset.lang;
        dd.classList.remove('show');
        applyLanguage();
        if (currentUser && users[currentUser]) {
          renderFriendsScreen();
          renderTasksScreen();
          renderAchievementsScreen();
          renderProfileScreen();
        } else {
          renderAuthScreen();
        }
      });
    });
  }

  document.getElementById('langToggle').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('langDropdown').classList.toggle('show');
  });

  document.addEventListener('click', (e) => {
    const dd = document.getElementById('langDropdown');
    const btn = document.getElementById('langToggle');
    if (!btn.contains(e.target) && !dd.contains(e.target)) {
      dd.classList.remove('show');
    }
  });

  function loadUsers() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { try { users = JSON.parse(saved); } catch (e) { users = {}; } }
  }

  function saveUsers() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
  }

  function refreshUsers() {
    loadUsers();
  }

  function saveSession(email) {
    localStorage.setItem(SESSION_KEY, email);
  }

  function getSession() {
    return localStorage.getItem(SESSION_KEY);
  }

  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }

  function containsBadWords(text) {
    const cleaned = text.toLowerCase().replace(/[^а-яёa-z]/g, '');
    return BAD_WORDS.some(word => cleaned.includes(word));
  }

  function generateFriendCode() {
    let code;
    do {
      code = Math.random().toString(36).substring(2, 10).toUpperCase();
    } while (Object.values(users).some(u => u.friendCode === code));
    return code;
  }

  function findUserByEmail(email) {
    refreshUsers();
    return users[email.trim().toLowerCase()] || null;
  }

  function findUserByCode(code) {
    refreshUsers();
    const normalizedCode = code.trim().toUpperCase();
    return Object.values(users).find(u => u.friendCode === normalizedCode) || null;
  }

  function getTitleByCups(cups) {
    for (let i = TITLES.length - 1; i >= 0; i--) {
      if (cups >= TITLES[i].min) return TITLES[i];
    }
    return TITLES[0];
  }

  function getCardClass(cups, selectedCard) {
    if (selectedCard === 'rainbow') return 'border-purple';
    if (['dragon', 'royal', 'nebula'].includes(selectedCard)) return 'border-purple';
    if (['sheriff', 'golden', 'phoenix', 'unicorn'].includes(selectedCard)) return 'border-gold';
    if (['ocean', 'diamond'].includes(selectedCard)) return 'border-blue';
    if (['master', 'forest'].includes(selectedCard)) return 'border-green';
    if (cups >= 3500) return 'border-purple';
    if (cups >= 2000) return 'border-purple';
    if (cups >= 1000) return 'border-blue';
    if (cups >= 500) return 'border-green';
    if (cups >= 200) return 'border-gold';
    return '';
  }

  function checkAchievementCondition(user, achievementId) {
    const friends = user.friends || [];
    switch (achievementId) {
      case 'f1': return friends.length >= 1;
      case 'f3': return friends.length >= 3;
      case 'f5': return friends.length >= 5;
      case 'f10': return friends.length >= 10;
      case 'c50': return friends.some(f => f.cups >= 50);
      case 'c100': return friends.some(f => f.cups >= 100);
      case 'c500': return friends.some(f => f.cups >= 500);
      case 'c1000': return friends.some(f => f.cups >= 1000);
      case 'c2000': return friends.some(f => f.cups >= 2000);
      case 'c3500': return friends.some(f => f.cups >= 3500);
      case 'q1': return (user.quarrelCount || 0) >= 1;
      case 'q5': return (user.quarrelCount || 0) >= 5;
      case 's3': return friends.some(f => (f.streak || 0) >= 3);
      case 's7': return friends.some(f => (f.streak || 0) >= 7);
      case 's14': return friends.some(f => (f.streak || 0) >= 14);
      case 's30': return friends.some(f => (f.streak || 0) >= 30);
      case 's60': return friends.some(f => (f.streak || 0) >= 60);
      case 't5': return (user.totalTasksCompleted || 0) >= 5;
      case 't20': return (user.totalTasksCompleted || 0) >= 20;
      case 't50': return (user.totalTasksCompleted || 0) >= 50;
      case 't100': return (user.totalTasksCompleted || 0) >= 100;
      case 'col3': return (user.unlockedCards || []).length >= 3;
      case 'col5': return (user.unlockedCards || []).length >= 5;
      case 'col10': return (user.unlockedCards || []).length >= 10;
      case 'all100': return friends.length > 0 && friends.every(f => f.cups >= 100);
      default: return false;
    }
  }

  function logout() {
    currentUser = null;
    clearSession();
    document.getElementById('mainTabs').style.display = 'none';
    ['friendsScreen','tasksScreen','achievementsScreen','profileScreen'].forEach(id => {
      const screen = document.getElementById(id);
      if (screen) { screen.innerHTML = ''; screen.classList.remove('active'); }
    });
    renderAuthScreen();
  }

  function renderAuthScreen() {
    const authScreen = document.getElementById('authScreen');
    authScreen.innerHTML = '';
    authScreen.classList.add('active');

    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginTop = '40px';

    card.innerHTML = `
      <h2 style="color:#ffd966;text-align:center;margin-bottom:14px;">${t('welcome')}</h2>
      <input id="authEmail" class="input-field" data-placeholder="email_ph" type="email" autocomplete="email">
      <span class="error-text" id="emailErr"></span>
      <input id="authCode" class="input-field" data-placeholder="code_ph" maxlength="8" autocomplete="off">
      <span class="error-text" id="codeErr"></span>
      <div id="regExtra" style="display:none;">
        <input id="authNick" class="input-field" data-placeholder="nick_ph" autocomplete="off">
        <span class="error-text" id="nickErr"></span>
        <label style="color:#ddd;display:block;margin-top:10px;">${t('date_label')}</label>
        <div class="wheel-container">
          <div class="wheel-col"><button class="wheel-btn" id="rDu">▲</button><span class="wheel-value" id="rDv">15</span><button class="wheel-btn" id="rDd">▼</button></div>
          <div class="wheel-col"><button class="wheel-btn" id="rMu">▲</button><span class="wheel-value" id="rMv">Янв</span><button class="wheel-btn" id="rMd">▼</button></div>
          <div class="wheel-col"><button class="wheel-btn" id="rYu">▲</button><span class="wheel-value" id="rYv">2005</span><button class="wheel-btn" id="rYd">▼</button></div>
        </div>
      </div>
      <button class="btn" id="authBtn">${t('login_btn')}</button>
      <p style="text-align:center;margin-top:12px;"><a id="toggleMode" style="color:#ffd966;cursor:pointer;font-weight:600;">${t('no_acc')}</a></p>
    `;

    authScreen.appendChild(card);
    applyLanguage();

    let mode = 'login', regDay = 15, regMonth = 6, regYear = 2005;

    function updateWheels() {
      document.getElementById('rDv').textContent = regDay;
      document.getElementById('rMv').textContent = MONTHS[regMonth - 1];
      document.getElementById('rYv').textContent = regYear;
    }

    document.getElementById('toggleMode').addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      document.getElementById('regExtra').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('authBtn').textContent = mode === 'login' ? t('login_btn') : t('register_btn');
      document.getElementById('toggleMode').textContent = mode === 'login' ? t('no_acc') : t('has_acc');
    });

    document.getElementById('rDu').addEventListener('click', () => { regDay = regDay % 31 + 1; updateWheels(); });
    document.getElementById('rDd').addEventListener('click', () => { regDay = regDay - 1 || 31; updateWheels(); });
    document.getElementById('rMu').addEventListener('click', () => { regMonth = regMonth % 12 + 1; updateWheels(); });
    document.getElementById('rMd').addEventListener('click', () => { regMonth = regMonth - 1 || 12; updateWheels(); });
    document.getElementById('rYu').addEventListener('click', () => { if (regYear < 2026) regYear++; updateWheels(); });
    document.getElementById('rYd').addEventListener('click', () => { if (regYear > 1920) regYear--; updateWheels(); });

    document.getElementById('authBtn').addEventListener('click', () => {
      refreshUsers();
      const email = document.getElementById('authEmail').value.trim().toLowerCase();
      const code = document.getElementById('authCode').value.trim();

      if (!email.includes('@')) { alert(t('email_err')); return; }
      if (code.length !== 8) { alert(t('code_err')); return; }

      if (mode === 'register') {
        const nick = document.getElementById('authNick').value.trim();
        if (!nick) { alert(t('nick_err')); return; }
        if (containsBadWords(nick)) { alert(t('bad_nick')); return; }
        if (users[email]) { alert(t('email_used')); return; }

        const friendCode = generateFriendCode();
        users[email] = {
          email, nick, code, friendCode,
          profile: { avatar: '🙂', day: regDay, month: regMonth, year: regYear },
          friends: [],
          unlockedAvatars: ['🙂'],
          unlockedCards: ['default'],
          selectedCard: 'default',
          claimedAchievements: [],
          totalTasksCompleted: 0,
          quarrelCount: 0
        };
        saveUsers();
        currentUser = email;
        saveSession(email);
        enterApp();
      } else {
        const user = users[email];
        if (!user) { alert(t('email_not_found')); return; }
        if (user.code !== code) { alert(t('wrong_code')); return; }
        currentUser = email;
        saveSession(email);
        enterApp();
      }
    });
  }

  function enterApp() {
    document.getElementById('authScreen').classList.remove('active');
    document.getElementById('authScreen').innerHTML = '';
    document.getElementById('mainTabs').style.display = 'flex';
    switchTab('friends');
  }

  const tabButtons = document.querySelectorAll('#mainTabs .tab');
  const screens = {
    friends: document.getElementById('friendsScreen'),
    tasks: document.getElementById('tasksScreen'),
    achievements: document.getElementById('achievementsScreen'),
    profile: document.getElementById('profileScreen')
  };

  function switchTab(tabName) {
    tabButtons.forEach(btn => btn.classList.remove('active'));
    const activeTab = document.querySelector(`#mainTabs .tab[data-tab="${tabName}"]`);
    if (activeTab) activeTab.classList.add('active');
    Object.values(screens).forEach(s => s.classList.remove('active'));
    if (screens[tabName]) screens[tabName].classList.add('active');
    if (tabName === 'friends') renderFriendsScreen();
    if (tabName === 'tasks') renderTasksScreen();
    if (tabName === 'achievements') renderAchievementsScreen();
    if (tabName === 'profile') renderProfileScreen();
  }
  tabButtons.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

  function renderFriendsScreen() {
    refreshUsers();
    const container = screens.friends;
    container.innerHTML = '';
    const user = users[currentUser];
    if (!user) return;

    if (!user.friends || user.friends.length === 0) {
      container.innerHTML = `<p style="text-align:center;color:#aaa;margin-top:50px;">${t('no_friends')}</p>`;
    } else {
      user.friends.forEach(friend => {
        const friendUser = Object.values(users).find(u => u.friendCode === friend.code);
        const title = getTitleByCups(friend.cups);
        const cardClass = getCardClass(friend.cups, friendUser ? friendUser.selectedCard : 'default');

        const card = document.createElement('div');
        card.className = `card ${cardClass}`;
        card.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;">
            <span class="friend-avatar">${friendUser ? friendUser.profile.avatar : '🙂'}</span>
            <div style="flex:1;">
              <strong>${friendUser ? friendUser.nick : friend.code}</strong>
              <div style="color:#f9c74f;font-size:0.85rem;">${title.name}</div>
            </div>
            <div style="text-align:right;">
              <div>🏆 ${friend.cups}</div>
              <span class="streak-badge">🔥 ${friend.streak || 0} дн</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    const addButton = document.createElement('button');
    addButton.className = 'btn';
    addButton.textContent = t('add_friend');
    addButton.addEventListener('click', () => showAddFriendModal());
    container.appendChild(addButton);
  }

  function showAddFriendModal() {
    refreshUsers();
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.innerHTML = `
      <div class="modal-content">
        <h3 style="color:#ffd966;margin-bottom:12px;">${t('add_friend')}</h3>
        <p style="color:#aaa;font-size:0.8rem;">${t('add_by_code')}</p>
        <input id="addCodeInput" class="input-field" placeholder="ABC12345">
        <span class="error-text" id="addErr"></span>
        <div id="addPreview" style="margin:10px 0;min-height:40px;"></div>
        <button class="btn" id="confirmAddBtn" disabled>${t('confirm')}</button>
        <button class="btn" id="cancelAddBtn" style="background:#555;">${t('cancel')}</button>
      </div>
    `;
    document.body.appendChild(modal);

    const codeInput = modal.querySelector('#addCodeInput');
    const errorSpan = modal.querySelector('#addErr');
    const previewDiv = modal.querySelector('#addPreview');
    const confirmBtn = modal.querySelector('#confirmAddBtn');
    const cancelBtn = modal.querySelector('#cancelAddBtn');
    let foundUser = null;

    function updatePreview() {
      refreshUsers();
      const rawCode = codeInput.value.trim();
      errorSpan.style.display = 'none';
      previewDiv.innerHTML = '';
      confirmBtn.disabled = true;
      foundUser = null;

      if (!rawCode) return;

      const normalizedCode = rawCode.toUpperCase();
      foundUser = findUserByCode(normalizedCode);
      const currentUserData = users[currentUser];

      if (!foundUser) {
        errorSpan.textContent = t('not_found');
        errorSpan.style.display = 'block';
      } else if (foundUser.email === currentUser) {
        errorSpan.textContent = t('self_add');
        errorSpan.style.display = 'block';
      } else if (currentUserData.friends.some(f => f.code === foundUser.friendCode)) {
        errorSpan.textContent = t('already');
        errorSpan.style.display = 'block';
      } else {
        previewDiv.innerHTML = `
          <div class="card" style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:2rem;">${foundUser.profile.avatar}</span>
            <div>
              <strong>${foundUser.nick}</strong>
              <div style="font-size:0.8rem;color:#aaa;">${foundUser.friendCode}</div>
              <div style="color:#6fcf97;font-size:0.8rem;">${t('found_friend')}</div>
            </div>
          </div>
        `;
        confirmBtn.disabled = false;
      }
    }

    codeInput.addEventListener('input', updatePreview);

    confirmBtn.addEventListener('click', () => {
      if (!foundUser) return;
      const currentUserData = users[currentUser];
      currentUserData.friends.push({ code: foundUser.friendCode, cups: 0, streak: 0 });
      if (!foundUser.friends.some(f => f.code === currentUserData.friendCode)) {
        foundUser.friends.push({ code: currentUserData.friendCode, cups: 0, streak: 0 });
      }
      saveUsers();
      renderFriendsScreen();
      modal.remove();
    });

    cancelBtn.addEventListener('click', () => modal.remove());
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  }

  function renderTasksScreen() {
    refreshUsers();
    const container = screens.tasks;
    container.innerHTML = `<h3 style="color:#ffd966;">${t('tasks_title')}</h3>`;
    const user = users[currentUser];
    if (!user.friends.length) {
      container.innerHTML += '<p style="color:#aaa;">Добавьте друга</p>';
      return;
    }

    user.friends.forEach(friend => {
      const friendUser = Object.values(users).find(u => u.friendCode === friend.code);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<strong>${friendUser ? friendUser.nick : friend.code}</strong>`;

      const tasks = [
        { label: '🚶 Прогулка +20', cups: 20 },
        { label: '🏠 В гости +25', cups: 25 },
        { label: '🎮 Игра +22', cups: 22 },
        { label: '🆘 Помощь +15', cups: 15 },
        { label: '🎁 Сюрприз +30', cups: 30 }
      ];

      tasks.forEach(task => {
        const taskBtn = document.createElement('button');
        taskBtn.className = 'btn';
        taskBtn.textContent = task.label;
        taskBtn.addEventListener('click', () => {
          friend.cups += task.cups;
          friend.streak = (friend.streak || 0) + 1;
          user.totalTasksCompleted = (user.totalTasksCompleted || 0) + 1;
          if (friendUser) {
            const reverse = friendUser.friends.find(f => f.code === user.friendCode);
            if (reverse) reverse.cups += task.cups;
          }
          saveUsers();
          renderTasksScreen();
          renderFriendsScreen();
        });
        card.appendChild(taskBtn);
      });

      const quarrelBtn = document.createElement('button');
      quarrelBtn.className = 'btn danger';
      quarrelBtn.textContent = t('quarrel');
      quarrelBtn.addEventListener('click', () => {
        friend.cups = Math.max(0, friend.cups - 18);
        friend.streak = 0;
        user.quarrelCount = (user.quarrelCount || 0) + 1;
        saveUsers();
        renderTasksScreen();
      });
      card.appendChild(quarrelBtn);
      container.appendChild(card);
    });
  }

  function renderAchievementsScreen() {
    const container = screens.achievements;
    container.innerHTML = `<h3 style="color:#ffd966;">${t('tab_ach')}</h3>`;
    const user = users[currentUser];
    ACHIEVEMENTS.forEach(ach => {
      const claimed = user.claimedAchievements?.includes(ach.id);
      const canClaim = checkAchievementCondition(user, ach.id) && !claimed;
      const card = document.createElement('div');
      card.className = 'achievement-card';
      if (canClaim) card.classList.add('glow-achievement');
      card.innerHTML = `<strong>${ach.name}</strong><br><small>${ach.desc}</small><br><small style="color:#f9c74f">${ach.reward}</small>`;
      if (claimed) card.innerHTML += `<p style="color:#6fcf97;">${t('claimed')}</p>`;
      else if (canClaim) {
        const claimBtn = document.createElement('button');
        claimBtn.className = 'btn';
        claimBtn.textContent = t('get');
        claimBtn.addEventListener('click', () => {
          if (!user.claimedAchievements) user.claimedAchievements = [];
          user.claimedAchievements.push(ach.id);
          const [type, value] = ach.reward.split(':');
          if (type === 'avatar' && !user.unlockedAvatars.includes(value)) user.unlockedAvatars.push(value);
          if (type === 'card' && !user.unlockedCards.includes(value)) user.unlockedCards.push(value);
          saveUsers();
          renderAchievementsScreen();
          renderProfileScreen();
        });
        card.appendChild(claimBtn);
      } else {
        card.innerHTML += `<p style="color:#ff6b6b;">${t('locked')}</p>`;
      }
      container.appendChild(card);
    });
  }

  function renderProfileScreen() {
    const container = screens.profile;
    container.innerHTML = '';
    const user = users[currentUser];
    if (!user) return;
    const age = new Date().getFullYear() - user.profile.year;
    const cardStyle = getCardClass(0, user.selectedCard);
    const card = document.createElement('div');
    card.className = `card ${cardStyle}`;
    card.innerHTML = `
      <div style="text-align:center;">
        <span style="font-size:4rem;">${user.profile.avatar}</span>
        <h2>${user.nick}</h2>
        <p>📧 ${user.email}</p>
        <p>🎂 ${age} лет · ${user.profile.day} ${MONTHS[user.profile.month-1]} ${user.profile.year}</p>
        <p>${t('card_label')} ${user.selectedCard}</p>
        <div class="code-display">
          <span>${t('your_code')} <strong>${user.friendCode}</strong></span>
          <button class="btn copy" id="copyCodeBtn">${t('copy')}</button>
        </div>
      </div>
    `;

    const editBtn = document.createElement('button');
    editBtn.className = 'btn';
    editBtn.textContent = t('edit');
    editBtn.addEventListener('click', () => showEditProfileModal());
    card.appendChild(editBtn);

    const logoutBtn = document.createElement('button');
    logoutBtn.className = 'btn logout';
    logoutBtn.textContent = t('logout');
    logoutBtn.addEventListener('click', () => logout());
    card.appendChild(logoutBtn);

    container.appendChild(card);

    document.getElementById('copyCodeBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(user.friendCode).then(() => {
        const btn = document.getElementById('copyCodeBtn');
        btn.textContent = t('copied');
        setTimeout(() => { btn.textContent = t('copy'); }, 2000);
      });
    });
  }

  function showEditProfileModal() {
    const user = users[currentUser];
    const modal = document.createElement('div');
    modal.className = 'modal active';
    let editDay = user.profile.day, editMonth = user.profile.month, editYear = user.profile.year;
    modal.innerHTML = `
      <div class="modal-content">
        <h3 style="color:#ffd966;">${t('edit')}</h3>
        <div class="wheel-container">
          <div class="wheel-col"><button class="wheel-btn" id="eDu">▲</button><span class="wheel-value" id="eDv">${editDay}</span><button class="wheel-btn" id="eDd">▼</button></div>
          <div class="wheel-col"><button class="wheel-btn" id="eMu">▲</button><span class="wheel-value" id="eMv">${MONTHS[editMonth-1]}</span><button class="wheel-btn" id="eMd">▼</button></div>
          <div class="wheel-col"><button class="wheel-btn" id="eYu">▲</button><span class="wheel-value" id="eYv">${editYear}</span><button class="wheel-btn" id="eYd">▼</button></div>
        </div>
        <label>${t('avatar_label')}</label>
        <div id="avGrid" style="display:flex;flex-wrap:wrap;gap:6px;">${user.unlockedAvatars.map(a => `<span style="font-size:1.8rem;cursor:pointer;" data-avatar="${a}">${a}</span>`).join('')}</div>
        <label>${t('card_label')}</label>
        <select id="cardSelect" style="width:100%;padding:10px;border-radius:18px;background:#2a2340;color:white;">${user.unlockedCards.map(c => `<option ${user.selectedCard===c?'selected':''}>${c}</option>`).join('')}</select>
        <button class="btn" id="saveEditBtn">${t('save')}</button>
      </div>
    `;
    document.body.appendChild(modal);
    function updateWheels() {
      modal.querySelector('#eDv').textContent = editDay;
      modal.querySelector('#eMv').textContent = MONTHS[editMonth-1];
      modal.querySelector('#eYv').textContent = editYear;
    }
    modal.querySelector('#eDu').onclick = () => { editDay = editDay % 31 + 1; updateWheels(); };
    modal.querySelector('#eDd').onclick = () => { editDay = editDay - 1 || 31; updateWheels(); };
    modal.querySelector('#eMu').onclick = () => { editMonth = editMonth % 12 + 1; updateWheels(); };
    modal.querySelector('#eMd').onclick = () => { editMonth = editMonth - 1 || 12; updateWheels(); };
    modal.querySelector('#eYu').onclick = () => { if (editYear < 2026) editYear++; updateWheels(); };
    modal.querySelector('#eYd').onclick = () => { if (editYear > 1920) editYear--; updateWheels(); };
    modal.querySelectorAll('#avGrid span').forEach(span => {
      span.addEventListener('click', function() {
        user.profile.avatar = this.dataset.avatar;
        saveUsers();
        renderProfileScreen();
        modal.remove();
      });
    });
    modal.querySelector('#saveEditBtn').addEventListener('click', () => {
      user.profile.day = editDay;
      user.profile.month = editMonth;
      user.profile.year = editYear;
      user.selectedCard = modal.querySelector('#cardSelect').value;
      saveUsers();
      renderProfileScreen();
      modal.remove();
    });
  }

  buildLangDropdown();
  loadUsers();
  const savedSession = getSession();
  if (savedSession && users[savedSession]) {
    currentUser = savedSession;
    enterApp();
  } else {
    currentUser = null;
    clearSession();
    renderAuthScreen();
  }
})();
</script>
</body>
</html>
